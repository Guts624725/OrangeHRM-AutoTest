login_api:
  method: post
  url: web/index.php/auth/validate
  headers:
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/148.0.0.0 Safari/537.36
    Content-Type: application/x-www-form-urlencoded

  data:
    "_token": "${_token}"
    "username": "${username}"
    "password": "${password}"